<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ORBIZ - Fast Barcode Scanner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
    }
    #reader {
      width: 100%;
      height: 75vh;
      background: #000;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
    }
    .scanner-footer {
      padding: 15px;
      background: #1a1a1a;
      text-align: center;
    }
    .guide-banner {
      background: rgba(82, 24, 90, 0.9);
      color: #fff;
      padding: 10px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="guide-banner" id="scannerTitle">
    Arahkan kamera ke Barcode / QR Code
  </div>

  <div id="reader"></div>

  <div class="scanner-footer">
    <div id="statusMsg" class="small text-muted mb-2">Mengaktifkan kamera live...</div>
    <button class="btn btn-danger btn-sm px-4 fw-bold" onclick="window.close()">Tutup Scanner</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetField = urlParams.get('target') || 'unknown';
    const labelTitle = urlParams.get('label');
    if (labelTitle) {
      document.getElementById('scannerTitle').innerText = decodeURIComponent(labelTitle);
    }

    const html5QrCode = new Html5Qrcode("reader");
    const scanConfig = {
      fps: 20,
      qrbox: (w, h) => {
        const minDim = Math.min(w, h);
        return { width: Math.floor(w * 0.85), height: Math.floor(minDim * 0.55) };
      },
      aspectRatio: 1.333333
    };

    html5QrCode.start(
      { facingMode: "environment" },
      scanConfig,
      (decodedText) => {
        const result = decodedText.trim();

        // Audio Beep
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch(e) {}

        // Kirim hasil scan ke portal Apps Script
        if (window.opener) {
          window.opener.postMessage({
            type: "ORBIZ_SCAN_SUCCESS",
            target: targetField,
            value: result
          }, "*");
        }

        // Tutup otomatis tab scanner
        setTimeout(() => {
          window.close();
        }, 150);
      },
      (errorMessage) => {}
    ).then(() => {
      document.getElementById('statusMsg').innerText = "Kamera aktif. Arahkan pada barcode/QR.";
    }).catch(err => {
      document.getElementById('statusMsg').innerHTML = `<span class="text-danger">Izin kamera ditolak: ${err}</span>`;
    });
  </script>
</body>
</html>
